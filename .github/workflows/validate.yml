name: Validate ContactPanda Basic

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Validate source
        run: ./tools/check.sh

  plugin-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Run WordPress Plugin Check
        uses: wordpress/plugin-check-action@v1
        with:
          build-dir: './contactpanda'

