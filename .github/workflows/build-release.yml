name: Build ContactPanda Basic package

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tested_wordpress:
        description: Highest WordPress version verified for this release
        required: false
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Build installable ZIP files
        env:
          PANDA_OUTPUT_DIR: dist
          CONTACTPANDA_TESTED_WP: ${{ inputs.tested_wordpress }}
        run: ./tools/build-release.sh
      - uses: actions/upload-artifact@v4
        with:
          name: contactpanda-basic-package
          path: dist/*
          if-no-files-found: error
      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          cp "dist/contactpanda-basic-${version}.zip" dist/contactpanda-basic.zip

          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --draft
          fi
          gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          if [[ "$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft)" == true ]]; then
            gh release edit "$GITHUB_REF_NAME" --draft=false --latest
          fi

